[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argelius-doppler-lab"
version = "0.3.0"
description = "An aircraft-audio investigation toolkit with reproducible Doppler analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Argelius Labs"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "certifi>=2024.7.4", "ijson>=3.3,<4", "rasterio>=1.4,<2", "pyproj>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
binary = ["pyinstaller==6.22.3"]
benchmark = ["psutil>=7,<8"]

[project.scripts]
doppler-lab = "doppler_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
