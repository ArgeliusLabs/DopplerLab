name: Tests, packages and native candidates
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a reviewed version after real-recording validation'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python scripts/package_release.py
      - run: python scripts/verify_release.py
      - run: doppler-lab demo --output work/ci-case
      - run: doppler-lab run work/ci-case/case.json --output work/ci-report --quiet
  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,binary]"
      - run: python scripts/build_binary.py --target ${{ matrix.target }}
      - name: Exercise bundled executable outside source tree
        shell: bash
        run: |
          executable="$(find dist/native -type f \( -name doppler-lab -o -name doppler-lab.exe \) -print -quit)"
          python scripts/smoke_binary.py "$executable"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/native/*.zip
            dist/native/*.tar.gz
            dist/native/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [test, native]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' && github.repository == 'ArgeliusLabs/DopplerLab'
    runs-on: ubuntu-latest
    concurrency:
      group: experimental-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/package_release.py
      - run: python scripts/verify_release.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - name: Publish a new experimental version once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(python -c 'from doppler_lab import __version__; print(__version__)')"
          if [[ "$version" == *dev* ]]; then
            echo "Development versions are build candidates, not releases."
            exit 1
          fi
          tag="v${version}"
          existing="$(gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name')"
          if printf '%s\n' "$existing" | grep -Fxq "$tag"; then
            echo "Release ${tag} already exists; its artifacts remain unchanged."
            exit 0
          fi
          cat dist/native/*.sha256 >> dist/SHA256SUMS.txt
          mapfile -t artifacts < <(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.whl' -o -name SHA256SUMS.txt -o -name source-inventory.json \) | sort)
          gh release create "$tag" "${artifacts[@]}" \
            --target "$GITHUB_SHA" \
            --title "Argelius Doppler Lab ${tag} — experimental investigation toolkit" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease
