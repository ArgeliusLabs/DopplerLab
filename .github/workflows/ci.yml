name: Tests, packages and native candidates
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish an experimental version with its documented testing status'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python scripts/package_release.py
      - run: python scripts/verify_release.py
      - run: doppler-lab demo --output work/ci-case
      - run: doppler-lab run work/ci-case/case.json --output work/ci-report --quiet
  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,binary]"
      - run: python scripts/build_binary.py --target ${{ matrix.target }}
      - name: Exercise bundled executable outside source tree
        shell: bash
        run: |
          executable="$(find dist/native -type f \( -name doppler-lab -o -name doppler-lab.exe \) -print -quit)"
          python scripts/smoke_binary.py "$executable"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/native/*.zip
            dist/native/*.tar.gz
            dist/native/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [test, native]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'ArgeliusLabs/DopplerLab' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish v')))
    runs-on: ubuntu-latest
    concurrency:
      group: experimental-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/package_release.py
      - run: python scripts/verify_release.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - name: Publish a new experimental version once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(python -c 'from doppler_lab import __version__; print(__version__)')"
          if [[ "$version" == *dev* ]]; then
            echo "Development versions are build candidates, not releases."
            exit 1
          fi
          tag="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == push && "$(git log -1 --format=%s)" != "release: publish $tag" ]]; then
            echo "The explicit publishing commit must name the exact package version."
            exit 1
          fi
          existing="$(gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name')"
          cat dist/native/*.sha256 >> dist/SHA256SUMS.txt
          mapfile -t artifacts < <(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.whl' -o -name SHA256SUMS.txt -o -name source-inventory.json \) | sort)
          if printf '%s\n' "$existing" | grep -Fxq "$tag"; then
            draft="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.draft')"
            if [[ "$draft" != true ]]; then
              echo "Release ${tag} is already published; its artifacts remain unchanged."
              exit 0
            fi
            draft_target="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq '.target_commitish')"
            if [[ "$draft_target" != "$GITHUB_SHA" ]]; then
              echo "Existing draft belongs to another source commit; refusing to replace it."
              exit 1
            fi
            gh release upload "$tag" "${artifacts[@]}" --clobber
          else
            gh release create "$tag" "${artifacts[@]}" \
              --target "$GITHUB_SHA" \
              --title "Argelius Doppler Lab ${tag} — experimental; testing in progress" \
              --notes-file docs/RELEASE_NOTES.md \
              --draft --prerelease
          fi
          gh release edit "$tag" --draft=false --prerelease
